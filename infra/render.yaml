# Blueprint de Render para la API de MiClub.
# Uso: conectar el repositorio en Render → New → Blueprint → seleccionar este archivo.
# Documentación: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: miclub-api
    runtime: node
    rootDir: backend
    # `npm run build` ya corre `prebuild` (`prisma generate`). No repetirlo.
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
